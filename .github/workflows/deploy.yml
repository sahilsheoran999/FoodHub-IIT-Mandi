name: Full-stack CI and Frontend Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: github.actor
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: 'FoodHub IIT Mandi Backend'
          file: 'FoodHub IIT Mandi Backend/Dockerfile'
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/foodhub-backend:latest
            ghcr.io/${{ github.repository_owner }}/foodhub-backend:${{ github.sha }}

  deploy-frontend:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Install frontend dependencies
        run: npm ci --prefix 'FoodHub IIT Mandi Frontend'
      - name: Build frontend
        run: npm run build --prefix 'FoodHub IIT Mandi Frontend'
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'http://localhost:8080' }}
      - name: Deploy to gh-pages branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if git ls-remote --exit-code origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . || true
          cp -r "FoodHub IIT Mandi Frontend/dist/." .
          git add --all
          git commit -m "Deploy frontend to GitHub Pages [skip ci]" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
